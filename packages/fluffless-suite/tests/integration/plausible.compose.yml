name: fl-stats-plausible
services:
  pdb:
    image: postgres:16-alpine
    environment: { POSTGRES_PASSWORD: postgres }
    healthcheck: { test: ["CMD-SHELL","pg_isready -U postgres"], interval: 3s, retries: 20 }
  ch:
    image: clickhouse/clickhouse-server:24.12-alpine
    ulimits: { nofile: { soft: 262144, hard: 262144 } }
    environment: { CLICKHOUSE_SKIP_USER_SETUP: "1" }
  plausible:
    image: ghcr.io/plausible/community-edition:v3.0.1
    command: sh -c "/entrypoint.sh db createdb && /entrypoint.sh db migrate && /entrypoint.sh run"
    depends_on: { pdb: { condition: service_healthy }, ch: { condition: service_started } }
    environment:
      BASE_URL: http://127.0.0.1:8100
      SECRET_KEY_BASE: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      DATABASE_URL: postgres://postgres:postgres@pdb:5432/plausible_db
      CLICKHOUSE_DATABASE_URL: http://ch:8123/plausible_events_db
      DISABLE_REGISTRATION: "false"
    ports: ["127.0.0.1:8100:8000"]
