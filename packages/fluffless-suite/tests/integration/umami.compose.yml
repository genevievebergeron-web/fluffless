name: fl-stats-int
services:
  umami-db:
    image: postgres:16-alpine
    environment: { POSTGRES_DB: umami, POSTGRES_USER: umami, POSTGRES_PASSWORD: umami }
    healthcheck: { test: ["CMD-SHELL","pg_isready -U umami"], interval: 3s, retries: 20 }
  umami:
    # Umami 3.4.0, épinglée le 26 oct. 2026 : la version du verdict du 12 oct. (docs/stats-api-verdict-2026-10.md).
    # Une autre version demande de refaire ce verdict.
    image: ghcr.io/umami-software/umami:3.4.0@sha256:85909afc45bdcda1917394594a087421fdbb05610fded0fa9f6fb861abb2f367
    depends_on: { umami-db: { condition: service_healthy } }
    environment:
      DATABASE_URL: postgresql://umami:umami@umami-db:5432/umami
      APP_SECRET: integration-test-secret
    ports: ["127.0.0.1:3010:3000"]
